<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1215">
<title>Krafttraining</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --base:#0F1215; --surf:#171C21; --surf2:#20272E; --line:#2C353E;
    --text:#E9EDF1; --mute:#8B97A4; --L:#6C8EBF; --M:#E0A340; --H:#E0524D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--base);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
  input{font:inherit}
  .num{font-variant-numeric:tabular-nums}

  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;
    height:56px;padding:0 16px;background:var(--base);border-bottom:1px solid var(--line)}
  header .t{font-size:16px;font-weight:600}
  header .back{font-size:26px;line-height:1;color:var(--mute)}
  header .sync{margin-left:auto;font-size:12px;color:var(--mute)}
  main{padding:16px 16px 110px}

  nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--base);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:15px 0;font-size:13px;font-weight:500;color:var(--mute)}
  nav button.on{color:var(--text)}

  .card{background:var(--surf);border-radius:12px;padding:12px;margin-bottom:18px}
  .row{background:var(--surf);border-radius:12px;padding:12px 16px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}
  .mute{color:var(--mute)}
  .sm{font-size:13px}
  .xs{font-size:12px;line-height:1.6}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .big{background:var(--surf);border:1px solid var(--line);border-radius:12px;
    padding:26px 16px;text-align:left}
  .big b{display:block;font-size:30px}

  .setrow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .setrow .i{width:12px;font-size:13px;color:var(--mute)}
  .step{display:flex;align-items:center;gap:2px}
  .step button{width:44px;height:46px;background:var(--surf2);font-size:24px;
    font-weight:300;color:var(--mute);display:flex;align-items:center;justify-content:center}
  .step button:first-child{border-radius:8px 0 0 8px}
  .step button:last-child{border-radius:0 8px 8px 0}
  .step .v{height:46px;background:var(--surf2);text-align:center;font-size:18px;
    border:0;color:var(--text);padding:0}
  .eff{display:flex;gap:2px}
  .eff button{width:36px;height:46px;border-radius:8px;background:var(--surf2);
    color:var(--mute);font-size:14px;font-weight:600}
  .eff button.L.on{background:var(--L);color:var(--base)}
  .eff button.M.on{background:var(--M);color:var(--base)}
  .eff button.H.on{background:var(--H);color:var(--base)}

  .field{margin-bottom:16px}
  .field .lab{font-size:14px;color:var(--mute);margin-bottom:8px}
  .field .box{display:flex;align-items:center;background:var(--surf2);border-radius:12px}
  .field input{flex:1;height:54px;background:none;border:0;outline:none;color:var(--text);
    font-size:20px;padding:0 16px;font-variant-numeric:tabular-nums;min-width:0}
  .field .u{padding-right:16px;color:var(--mute);font-size:14px}

  .seg{display:flex;background:var(--surf);border-radius:12px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;padding:9px 0;border-radius:8px;font-size:14px;font-weight:500;color:var(--mute)}
  .seg button.on{background:var(--surf2);color:var(--text)}

  .primary{width:100%;height:50px;border-radius:12px;background:var(--text);
    color:var(--base);font-weight:600}
  .ghost{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);color:var(--text)}
  .danger{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);color:var(--H)}
  input[type=date]{width:100%;height:50px;border-radius:12px;background:var(--surf2);
    border:1px solid var(--line);color:var(--text);padding:0 16px;outline:none;margin-bottom:20px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script>
/* ============================================================ CONFIGURE ME
   Paste the Application (client) ID from your Microsoft app registration.
   Setup instructions are in SETUP.md.                                      */
const CLIENT_ID = "PASTE_YOUR_CLIENT_ID_HERE";
/* ======================================================================== */

const APP_VERSION = "2026.09.13";
const SCOPES = ["Files.ReadWrite.AppFolder", "User.Read"];
const ROOT = "https://graph.microsoft.com/v1.0/me/drive/special/approot";

/* ------------------------------------------------------------- the plan */
const PLAN = {
  WU: ["90-90 Hip Switch","T-Spine Rotation","Band Shoulder Dislocates",
       "Band Pull-Aparts","Band Shoulder Press","Rowing machine / Treadmill"],
  A: [
    {n:"DB Goblet Squat",s:3,t:"3 × 12",w:6},
    {n:"Hyperextension Lower Back",s:3,t:"3 × 12",w:10,set:"Sitz 4"},
    {n:"Leg Curl Machine",s:3,t:"3 × 12",w:35,set:"Sitz 5 · UP 2 · DW 3"},
    {n:"Cable Low Row",s:3,t:"3 × 12",w:40},
    {n:"Chest Press Machine",s:3,t:"3 × 12",w:35,set:"Sitz 7"},
    {n:"Abdominals (oblique)",s:3,t:"3 × max",w:0},
    {n:"Abdominals Leg Rise",s:3,t:"3 × max",w:0},
  ],
  B: [
    {n:"DB Goblet Lateral Squat",s:3,t:"3 × 12",w:6},
    {n:"DB Deadlift",s:3,t:"3 × 12",w:10},
    {n:"Cable Low Row",s:3,t:"3 × 12",w:40},
    {n:"Chest Press Machine",s:3,t:"3 × 12",w:35,set:"Sitz 7"},
    {n:"Split Squat Iso-Hold",s:3,t:"3 × 15 sec",w:0,unit:"sec"},
  ],
};
const ALL_EX = [...PLAN.A, ...PLAN.B].filter((e,i,a)=>a.findIndex(y=>y.n===e.n)===i);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const nice  = d => d ? d.split("-").reverse().slice(0,2).join(".") : "";

/* --------------------------------------------------- renames / migration */
const RENAMES = { "Abdominals": "Abdominals Leg Rise" };
function migrate(d) {
  let changed = false;
  const fix = s => {
    if (!s || !s.entries) return;
    for (const [oldN, newN] of Object.entries(RENAMES)) {
      if (s.entries[oldN] !== undefined) {
        if (s.entries[newN] === undefined) s.entries[newN] = s.entries[oldN];
        delete s.entries[oldN];
        changed = true;
      }
    }
  };
  (d.history || []).forEach(fix);
  fix(d.draft);
  return changed;
}

/* ------------------------------------------------------------- csv import */
function parseCsv(text) {
  text = text.replace(/^\uFEFF/, "").trim();
  const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
  if (!lines.length) return { head: [], rows: [] };
  const delim = [";", "\t", ","].reduce((a, b) =>
    lines[0].split(b).length > lines[0].split(a).length ? b : a);
  const split = l => l.split(delim).map(c => c.trim().replace(/^"|"$/g, ""));
  return { head: split(lines[0]).map(x => x.toLowerCase().replace(/\s+/g, "_")),
           rows: lines.slice(1).map(split) };
}
const toNum = v => {
  if (v == null || v === "") return null;
  const n = parseFloat(String(v).replace(",", "."));
  return isNaN(n) ? null : n;
};
function toDate(v) {
  v = (v || "").trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
  return m ? `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` : null;
}

const EX_INDEX = (() => {
  const ix = {};
  ["A","B"].forEach(w => PLAN[w].forEach(ex => {
    const k = ex.n.toLowerCase();
    ix[k] = ix[k] || { name: ex.n, workouts: [] };
    ix[k].workouts.push(w);
  }));
  return ix;
})();

function importWorkouts(head, rows) {
  const c = n => head.indexOf(n);
  const ci = { d: c("date"), w: c("workout"), e: c("exercise"), s: c("set"),
               r: c("reps"), g: head.findIndex(x => x.startsWith("weight")), f: c("effort") };
  if (ci.d < 0 || ci.e < 0 || ci.r < 0)
    return "That file needs at least date, exercise and reps columns. Download the template.";

  const sessions = {}, unknown = new Set(), counters = {};
  let skipped = 0;
  for (const r of rows) {
    const date = toDate(r[ci.d]);
    const raw = (r[ci.e] || "").trim();
    if (!date || !raw) { skipped++; continue; }
    const hit = EX_INDEX[raw.toLowerCase()];
    if (!hit) { unknown.add(raw); continue; }

    let w = ci.w >= 0 ? (r[ci.w] || "").trim().toUpperCase() : "";
    if (!["A","B"].includes(w)) w = hit.workouts.length === 1 ? hit.workouts[0] : "";
    if (!w) { unknown.add(`${raw} (needs a workout column: it's in both A and B)`); continue; }

    const key = `${date}|${w}`;
    if (!sessions[key]) {
      const entries = {};
      PLAN[w].forEach(ex => {
        entries[ex.n] = Array.from({ length: ex.s },
          () => ({ reps: "", weight: ex.w, effort: null }));
      });
      sessions[key] = { date, workout: w, entries, warmup: true };
    }
    const ckey = `${key}|${hit.name}`;
    counters[ckey] = (counters[ckey] || 0) + 1;
    const idx = (toNum(ci.s >= 0 ? r[ci.s] : null) || counters[ckey]) - 1;
    const slot = sessions[key].entries[hit.name];
    if (!slot || idx < 0 || idx >= slot.length) { skipped++; continue; }
    const eff = (ci.f >= 0 ? (r[ci.f] || "") : "").trim().toUpperCase();
    slot[idx] = {
      reps: toNum(r[ci.r]) ?? "",
      weight: ci.g >= 0 ? (toNum(r[ci.g]) ?? 0) : 0,
      effort: ["L","M","H"].includes(eff) ? eff : null,
    };
  }

  const list = Object.values(sessions);
  if (!list.length)
    return unknown.size ? `Nothing imported. Unrecognised: ${[...unknown].join(", ")}`
                        : "No usable rows found — check the date column.";
  let added = 0, replaced = 0;
  list.forEach(s => {
    const at = S.data.history.findIndex(h => h.date === s.date && h.workout === s.workout);
    if (at >= 0) { S.data.history[at] = s; replaced++; } else { S.data.history.push(s); added++; }
  });
  S.data.history.sort((a,b) => a.date.localeCompare(b.date));
  queuePush();
  let msg = `Imported ${added} new session${added===1?"":"s"}`;
  if (replaced) msg += `, replaced ${replaced}`;
  if (skipped) msg += `, skipped ${skipped} row${skipped===1?"":"s"}`;
  if (unknown.size) msg += `. Unrecognised: ${[...unknown].join(", ")}`;
  return msg + ".";
}

function importNumbers(head, rows) {
  const c = n => head.findIndex(x => x.startsWith(n));
  const ci = { d: head.indexOf("date"), w: c("morning_weight"),
               i: c("calories_in"), o: c("calories_burned") };
  if (ci.d < 0) return "That file needs a date column. Download the template.";
  let n = 0;
  for (const r of rows) {
    const date = toDate(r[ci.d]);
    if (!date) continue;
    const rec = Object.assign({}, S.data.daily[date]);
    if (ci.w >= 0 && toNum(r[ci.w]) !== null) rec.weight = toNum(r[ci.w]);
    if (ci.i >= 0 && toNum(r[ci.i]) !== null) rec.kcalIn = toNum(r[ci.i]);
    if (ci.o >= 0 && toNum(r[ci.o]) !== null) rec.kcalOut = toNum(r[ci.o]);
    S.data.daily[date] = rec; n++;
  }
  if (!n) return "No usable rows found — check the date column.";
  queuePush();
  return `Imported ${n} day${n===1?"":"s"} of numbers.`;
}

function templateCsv(kind) {
  if (kind === "numbers")
    return "date;morning_weight_kg;calories_in_kcal;calories_burned_kcal\r\n" +
           "2026-08-23;82.4;2180;2650\r\n";
  const out = ["date;workout;exercise;set;reps;weight_kg;effort"];
  ["A","B"].forEach(w => PLAN[w].forEach(ex => {
    for (let i = 1; i <= ex.s; i++) out.push(`;${w};${ex.n};${i};;${ex.w};`);
  }));
  return out.join("\r\n") + "\r\n";
}

/* ------------------------------------------------------------- app state */
let S = {
  tab:"train", screen:null, histMode:"sessions", dayDate:today(),
  data:{ history:[], daily:{}, draft:null, updatedAt:0 },
  account:null, sync:"offline", dirty:false,
};

/* ------------------------------------------------------------ local cache */
const LKEY = "krafttraining.v1";
const readLocal  = () => { try { return JSON.parse(localStorage.getItem(LKEY)); } catch { return null; } };
const writeLocal = d  => { try { localStorage.setItem(LKEY, JSON.stringify(d)); } catch {} };

/* ------------------------------------------------------------------- auth */
let pca = null;
async function initAuth() {
  if (CLIENT_ID.startsWith("PASTE")) { S.sync = "unconfigured"; return; }
  pca = new msal.PublicClientApplication({
    auth: { clientId: CLIENT_ID, authority: "https://login.microsoftonline.com/common",
            redirectUri: location.origin + location.pathname },
    cache: { cacheLocation: "localStorage" },
  });
  await pca.initialize();
  const res = await pca.handleRedirectPromise();
  if (res?.account) pca.setActiveAccount(res.account);
  const acc = pca.getActiveAccount() || pca.getAllAccounts()[0];
  if (acc) { pca.setActiveAccount(acc); S.account = acc; }
}
async function token() {
  if (!pca || !S.account) return null;
  try {
    const r = await pca.acquireTokenSilent({ scopes: SCOPES, account: S.account });
    return r.accessToken;
  } catch {
    await pca.acquireTokenRedirect({ scopes: SCOPES });
    return null;
  }
}
function signIn()  { pca ? pca.loginRedirect({ scopes: SCOPES }) : alert("Add your client ID first — see SETUP.md."); }
function signOut() { pca && pca.logoutRedirect(); }

/* --------------------------------------------------------- onedrive sync */
async function pull() {
  const t = await token(); if (!t) return;
  S.sync = "syncing"; paint();
  try {
    const r = await fetch(`${ROOT}:/krafttraining.json:/content`, { headers:{ Authorization:`Bearer ${t}` } });
    if (r.status === 404) { S.sync = "ready"; await push(); return; }
    if (!r.ok) throw new Error(r.status);
    const remote = await r.json();
    if ((remote.updatedAt || 0) > (S.data.updatedAt || 0)) { S.data = remote; writeLocal(remote); }
    S.sync = "ready";
  } catch (e) { console.error(e); S.sync = "error"; }
  paint();
}

let pushTimer = null;
function queuePush() {
  S.data.updatedAt = Date.now();
  writeLocal(S.data);
  S.dirty = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 1500);
}
async function push() {
  const t = await token(); if (!t) { S.sync = "offline"; return; }
  S.sync = "syncing"; paint();
  const put = (name, body, type) =>
    fetch(`${ROOT}:/${name}:/content`, { method:"PUT",
      headers:{ Authorization:`Bearer ${t}`, "Content-Type":type }, body });
  try {
    await put("krafttraining.json", JSON.stringify(S.data), "application/json");
    await put("krafttraining.csv", "\uFEFF" + buildCsv(), "text/csv");
    S.dirty = false; S.sync = "ready";
  } catch (e) { console.error(e); S.sync = "error"; }
  paint();
}

/* ------------------------------------------------------------------- csv */
function buildCsv() {
  const H = S.data.history, rows = [];
  const dates = H.map(h => h.date);
  rows.push(["","","","","DATUM >", ...dates.flatMap(d => [d,"",""])]);
  rows.push(["Workout","Exercise","Settings","Target","Set",
             ...dates.flatMap(() => ["Wdh.","Gewicht (kg)","Effort"])]);
  ["A","B"].forEach(w => {
    rows.push([`--- WORKOUT ${w} ---`]);
    PLAN[w].forEach(ex => {
      for (let i = 0; i < ex.s; i++) {
        const cells = H.flatMap(h => {
          const e = h.workout === w ? h.entries[ex.n]?.[i] : null;
          return e ? [e.reps ?? "", e.weight ?? "", e.effort ?? ""] : ["","",""];
        });
        rows.push([w, ex.n, ex.set || "", ex.t, i + 1, ...cells]);
      }
    });
    rows.push([]);
  });
  const head = "Date;Morning_Weight_kg;Calories_In_kcal;Calories_Burned_kcal;Net_kcal";
  const body = Object.keys(S.data.daily).sort().map(d => {
    const x = S.data.daily[d];
    const net = (x.kcalIn != null && x.kcalOut != null) ? x.kcalIn - x.kcalOut : "";
    return [d, x.weight ?? "", x.kcalIn ?? "", x.kcalOut ?? "", net].join(";");
  });
  return rows.map(r => r.join(";")).join("\r\n") + "\r\n\r\n" + [head, ...body].join("\r\n");
}

/* --------------------------------------------------------------- actions */
function lastFor(name) {
  const H = S.data.history;
  for (let i = H.length - 1; i >= 0; i--) {
    const e = H[i].entries[name];
    if (e && e.some(s => s.reps)) return { date: H[i].date, sets: e };
  }
  return null;
}
function startWorkout(w) {
  const entries = {};
  PLAN[w].forEach(ex => {
    const prev = lastFor(ex.n);
    entries[ex.n] = Array.from({ length: ex.s }, (_, i) => ({
      reps: prev?.sets[i]?.reps ?? "", weight: prev?.sets[i]?.weight ?? ex.w, effort: null,
    }));
  });
  S.data.draft = { date: today(), workout: w, entries, warmup: false };
  S.screen = { type:"session", idx:null };
  queuePush(); paint();
}
const currentSession = () => S.screen.idx === null ? S.data.draft : S.data.history[S.screen.idx];
function finishSession() {
  S.data.history.push(S.data.draft);
  S.data.history.sort((a,b) => a.date.localeCompare(b.date));
  S.data.draft = null; S.screen = null; S.tab = "history";
  queuePush(); paint();
}
function deleteSession(i) {
  S.data.history.splice(i,1); S.screen = null; queuePush(); paint();
}
function setDay(field, val) {
  const d = S.dayDate;
  S.data.daily[d] = Object.assign({}, S.data.daily[d], { [field]: val });
  queuePush();
}

/* ---------------------------------------------------------------- render */
const app = document.getElementById("app");

function stepper(kind, ex, i, value, suffix, width) {
  return `<div class="step">
    <button data-a="bump" data-k="${kind}" data-ex="${esc(ex)}" data-i="${i}" data-d="-1">−</button>
    <input class="v num" style="width:${width}" inputmode="decimal" type="number"
      data-a="setnum" data-k="${kind}" data-ex="${esc(ex)}" data-i="${i}" value="${value === "" ? "" : value}"
      placeholder="–">
    <button data-a="bump" data-k="${kind}" data-ex="${esc(ex)}" data-i="${i}" data-d="1">+</button>
  </div>`;
}
function effort(ex, i, cur) {
  return `<div class="eff">` + ["L","M","H"].map(e =>
    `<button class="${e}${cur===e?" on":""}" data-a="eff" data-ex="${esc(ex)}" data-i="${i}" data-e="${e}">${e}</button>`
  ).join("") + `</div>`;
}
function shell(title, body, opts = {}) {
  const badge = { ready:"synced", syncing:"syncing…", error:"sync failed", offline:"not signed in",
                  unconfigured:"setup needed" }[S.sync];
  return `<header>
      ${opts.back ? `<button class="back" data-a="back">‹</button>` : ""}
      <div class="t">${esc(title)}</div>
      <button class="sync" data-a="sync">${badge}${S.dirty ? " •" : ""}</button>
    </header>
    <main>${body}</main>
    ${opts.tabs ? `<nav>${[["train","Train"],["numbers","Numbers"],["history","History"]]
      .map(([k,l]) => `<button class="${S.tab===k?"on":""}" data-a="tab" data-t="${k}">${l}</button>`)
      .join("")}</nav>` : ""}`;
}

function viewSession() {
  const s = currentSession();
  if (!s) { S.screen = null; return viewTrain(); }
  const isDraft = S.screen.idx === null;
  const body = `
    <button class="card" style="width:100%;text-align:left;border:1px solid var(--line);
      background:${s.warmup ? "var(--surf2)" : "var(--surf)"}" data-a="warmup">
      <div style="display:flex;justify-content:space-between">
        <span style="font-weight:500">Warm-up</span>
        <span class="sm" style="color:${s.warmup ? "var(--L)" : "var(--mute)"}">
          ${s.warmup ? "done" : "tap when done"}</span>
      </div>
      <div class="xs mute" style="margin-top:6px">${PLAN.WU.join(" · ")}</div>
    </button>
    ${PLAN[s.workout].map(ex => {
      const prev = isDraft ? lastFor(ex.n) : null;
      const meta = [ex.set, prev && `last ${nice(prev.date)}: ${prev.sets.map(x=>x.reps||"–").join("/")} @ ${prev.sets[0].weight||0} kg`]
        .filter(Boolean).join(" · ");
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-weight:600">${esc(ex.n)}</span>
          <span class="xs mute">${ex.t}</span>
        </div>
        <div class="xs mute" style="margin-bottom:12px">${esc(meta)}</div>
        ${s.entries[ex.n].map((st,i) => `<div class="setrow">
          <span class="i">${i+1}</span>
          ${stepper("reps", ex.n, i, st.reps, ex.unit === "sec" ? "s" : "", "3.6rem")}
          ${stepper("weight", ex.n, i, st.weight, "", "4rem")}
          ${effort(ex.n, i, st.effort)}
        </div>`).join("")}
      </div>`;
    }).join("")}
    ${isDraft
      ? `<button class="primary" data-a="finish">Finish session</button>`
      : `<button class="danger" data-a="del" data-i="${S.screen.idx}">Delete this session</button>`}`;
  return shell(`Workout ${s.workout} · ${nice(s.date)}`, body, { back:true });
}

function viewExercise() {
  const name = S.screen.name;
  const rows = S.data.history.filter(h => h.entries[name]);
  const body = rows.length === 0 ? `<p class="mute">Nothing logged for this one yet.</p>`
    : rows.slice().reverse().map(h => `<div class="card">
        <div class="sm mute" style="display:flex;justify-content:space-between;margin-bottom:8px">
          <span>${nice(h.date)}</span><span>Workout ${h.workout}</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          ${h.entries[name].map(st => `<span class="num" style="font-size:15px">
            ${st.reps||"–"} × ${st.weight||0} kg${st.effort
              ? ` <b style="color:var(--${st.effort})">${st.effort}</b>` : ""}</span>`).join("")}
        </div></div>`).join("");
  return shell(name, body, { back:true });
}

function viewTrain() {
  const d = S.data.draft;
  const body = `
    ${d ? `<button class="card" style="width:100%;text-align:left;border:1px solid var(--M)" data-a="resume">
      <div class="sm" style="color:var(--M)">Session in progress</div>
      <div style="font-size:18px;font-weight:600">Workout ${d.workout} · ${nice(d.date)}</div>
    </button>` : ""}
    <div class="grid2">
      ${["A","B"].map(w => `<button class="big" data-a="start" data-w="${w}">
        <b>${w}</b><span class="sm mute">${PLAN[w].length} exercises</span></button>`).join("")}
    </div>
    <p class="sm mute" style="margin-top:24px;line-height:1.7">
      Starting a workout copies last time's reps and weights, so you adjust rather than type.</p>
    <p class="xs mute">Build ${APP_VERSION}</p>
    ${S.account
      ? `<p class="xs mute">Signed in as ${esc(S.account.username)} ·
         <button data-a="signout" style="color:var(--mute);text-decoration:underline">sign out</button></p>`
      : `<button class="ghost" style="margin-top:8px" data-a="signin">Connect OneDrive</button>`}`;
  return shell("Krafttraining", body, { tabs:true });
}

function viewNumbers() {
  const x = S.data.daily[S.dayDate] || {};
  const net = (x.kcalIn != null && x.kcalOut != null) ? x.kcalIn - x.kcalOut : null;
  const days = Object.keys(S.data.daily).sort().reverse().slice(0,14);
  const field = (lab,key,unit,ph) => `<div class="field"><div class="lab">${lab}</div>
    <div class="box"><input type="number" inputmode="decimal" placeholder="${ph}"
      data-a="day" data-f="${key}" value="${x[key] ?? ""}"><span class="u">${unit}</span></div></div>`;
  const body = `
    <input type="date" max="${today()}" value="${S.dayDate}" data-a="date">
    ${field("Morning weight","weight","kg","82.4")}
    ${field("Calories in — MacroFactor","kcalIn","kcal","2180")}
    ${field("Calories burned — Garmin","kcalOut","kcal","2650")}
    ${net !== null ? `<div class="card"><span class="sm mute">Net</span>
      <div class="num" style="font-size:26px;font-weight:600;color:${net>0?"var(--M)":"var(--L)"}">
        ${net>0?"+":""}${net} kcal</div></div>` : ""}
    ${days.length ? `<div style="margin-top:28px"><div class="sm mute" style="margin-bottom:8px">Recent days</div>
      ${days.map(k => { const y = S.data.daily[k];
        return `<button class="num" data-a="pickday" data-d="${k}" style="width:100%;display:flex;
          justify-content:space-between;padding:9px 12px;border-radius:8px;font-size:14px;
          background:${k===S.dayDate?"var(--surf2)":"transparent"}">
          <span class="mute">${nice(k)}</span><span>${y.weight ?? "–"} kg</span>
          <span class="mute">${y.kcalIn ?? "–"} / ${y.kcalOut ?? "–"}</span></button>`;
      }).join("")}</div>` : ""}`;
  return shell("Numbers", body, { tabs:true });
}

function viewHistory() {
  const H = S.data.history;
  const seg = `<div class="seg">${[["sessions","Sessions"],["exercises","Exercises"]]
    .map(([k,l]) => `<button class="${S.histMode===k?"on":""}" data-a="hmode" data-m="${k}">${l}</button>`).join("")}</div>`;
  let list;
  if (S.histMode === "sessions") {
    list = H.length === 0 ? `<p class="mute">Finish a workout and it lands here.</p>`
      : H.map((h,i) => ({h,i})).reverse().map(({h,i}) => {
          const sets = Object.values(h.entries).flat();
          const vol = sets.reduce((a,s) => a + (s.reps||0)*(s.weight||0), 0);
          const done = sets.filter(s => s.reps).length;
          return `<button class="row" data-a="opensession" data-i="${i}">
            <span><b>Workout ${h.workout}</b><br><span class="sm mute">${done} sets · ${Math.round(vol)} kg moved</span></span>
            <span class="mute">${nice(h.date)}</span></button>`;
        }).join("");
  } else {
    list = ALL_EX.map(ex => {
      const rows = H.filter(h => h.entries[ex.n]?.some(s => s.reps));
      const last = rows[rows.length-1];
      const top = last ? Math.max(...last.entries[ex.n].map(s => s.weight||0)) : null;
      return `<button class="row" data-a="openex" data-n="${esc(ex.n)}">
        <span>${esc(ex.n)}<br><span class="sm mute">${rows.length
          ? `${rows.length} sessions · last ${top} kg` : "not logged yet"}</span></span>
        <span class="mute">›</span></button>`;
    }).join("");
  }
  const body = seg + list + `
    <button class="ghost" style="margin-top:24px" data-a="openimport">Import past trainings</button>
    <button class="ghost" style="margin-top:8px" data-a="download">Download a copy as CSV</button>
    <p class="xs mute" style="margin-top:12px">Every change is written to
      <b>krafttraining.json</b> and <b>krafttraining.csv</b> in your OneDrive app folder.
      Open the CSV in Excel for charts.</p>`;
  return shell("History", body, { tabs:true });
}

function viewImport() {
  const body = `
    <p class="sm mute" style="line-height:1.7;margin-top:0">
      Fill a template in Excel and upload it here. Existing sessions with the same date and
      workout letter are replaced, everything else is left alone.</p>

    <div class="card">
      <div style="font-weight:600;margin-bottom:4px">Past workouts</div>
      <p class="xs mute" style="margin:0 0 12px">The template lists every exercise with a set
        per row. Copy the whole block once per session, put the date in the first column, then
        fill reps, weight and effort. Dates as 2026-08-23 or 23.08.2026. Blank rows are ignored.</p>
      <button class="ghost" data-a="tpl" data-k="workouts">Download workout template</button>
    </div>

    <div class="card">
      <div style="font-weight:600;margin-bottom:4px">Past daily numbers</div>
      <p class="xs mute" style="margin:0 0 12px">One row per day: morning weight, calories in,
        calories burned. Leave any cell blank to skip it.</p>
      <button class="ghost" data-a="tpl" data-k="numbers">Download numbers template</button>
    </div>

    <label class="primary" style="display:flex;align-items:center;justify-content:center;
      margin-top:24px">Choose a filled-in CSV
      <input type="file" accept=".csv,text/csv" data-a="file" style="display:none"></label>

    ${S.importMsg ? `<div class="card" style="margin-top:16px">
      <span class="sm">${esc(S.importMsg)}</span></div>` : ""}`;
  return shell("Import", body, { back:true });
}

function paint() {
  const active = document.activeElement;
  const key = active && active.dataset.a ? [active.dataset.a, active.dataset.f, active.dataset.ex, active.dataset.i, active.dataset.k].join("|") : null;
  const pos = active && active.selectionStart;
  app.innerHTML =
      S.screen?.type === "session"  ? viewSession()
    : S.screen?.type === "exercise" ? viewExercise()
    : S.screen?.type === "import"   ? viewImport()
    : S.tab === "train"             ? viewTrain()
    : S.tab === "numbers"           ? viewNumbers()
    :                                 viewHistory();
  if (key) {
    const el = [...app.querySelectorAll("input")].find(i =>
      [i.dataset.a, i.dataset.f, i.dataset.ex, i.dataset.i, i.dataset.k].join("|") === key);
    if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
  }
}

/* ---------------------------------------------------------------- events */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.tagName === "INPUT") return;
  const a = b.dataset.a, s = S.screen?.type === "session" ? currentSession() : null;
  switch (a) {
    case "tab":      S.tab = b.dataset.t; S.screen = null; break;
    case "back":     S.screen = null; break;
    case "start":    return startWorkout(b.dataset.w);
    case "resume":   S.screen = { type:"session", idx:null }; break;
    case "warmup":   s.warmup = !s.warmup; queuePush(); break;
    case "finish":   return finishSession();
    case "del":      if (confirm("Delete this session?")) return deleteSession(+b.dataset.i); return;
    case "eff": {
      const st = s.entries[b.dataset.ex][+b.dataset.i];
      st.effort = st.effort === b.dataset.e ? null : b.dataset.e; queuePush(); break;
    }
    case "bump": {
      const st = s.entries[b.dataset.ex][+b.dataset.i], k = b.dataset.k;
      st[k] = Math.max(0, Math.round((Number(st[k] || 0) + Number(b.dataset.d)) * 10) / 10);
      queuePush(); break;
    }
    case "opensession": S.screen = { type:"session", idx:+b.dataset.i }; break;
    case "openex":      S.screen = { type:"exercise", name:b.dataset.n }; break;
    case "hmode":       S.histMode = b.dataset.m; break;
    case "openimport":  S.screen = { type:"import" }; S.importMsg = ""; break;
    case "tpl": {
      const blob = new Blob(["\uFEFF" + templateCsv(b.dataset.k)], { type:"text/csv;charset=utf-8" });
      const a3 = document.createElement("a");
      a3.href = URL.createObjectURL(blob);
      a3.download = `template_${b.dataset.k}.csv`; a3.click();
      return;
    }
    case "pickday":     S.dayDate = b.dataset.d; break;
    case "sync":        return pull();
    case "signin":      return signIn();
    case "signout":     return signOut();
    case "download": {
      const blob = new Blob(["\uFEFF" + buildCsv()], { type:"text/csv;charset=utf-8" });
      const a2 = document.createElement("a");
      a2.href = URL.createObjectURL(blob); a2.download = `krafttraining_${today()}.csv`; a2.click();
      return;
    }
  }
  paint();
});

app.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.a) return;
  const v = el.value === "" ? null : parseFloat(el.value);
  if (el.dataset.a === "day")    { setDay(el.dataset.f, v); }
  if (el.dataset.a === "date")   { S.dayDate = el.value; paint(); }
  if (el.dataset.a === "setnum") {
    const s = currentSession();
    s.entries[el.dataset.ex][+el.dataset.i][el.dataset.k] = v === null ? "" : Math.max(0, v);
    queuePush();
  }
});

app.addEventListener("change", e => {
  if (e.target.dataset.a === "day") paint();
  if (e.target.dataset.a === "file") {
    const f = e.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const { head, rows } = parseCsv(String(fr.result));
        S.importMsg = head.includes("exercise") ? importWorkouts(head, rows)
                                                : importNumbers(head, rows);
      } catch (err) { console.error(err); S.importMsg = "Could not read that file."; }
      paint();
    };
    fr.readAsText(f, "utf-8");
  }
});

/* ------------------------------------------------------------------ boot */
(async () => {
  const local = readLocal();
  if (local) S.data = Object.assign(S.data, local);
  if (migrate(S.data)) writeLocal(S.data);
  paint();
  try { await initAuth(); } catch (e) { console.error(e); }
  if (S.account) { S.sync = "ready"; await pull(); if (migrate(S.data)) queuePush(); }
  else paint();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js")
      .then(reg => { reg.update(); setInterval(() => reg.update(), 60 * 60 * 1000); })
      .catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
  }
})();
window.addEventListener("online", () => { if (S.dirty) push(); });
</script>
</body>
</html>
